{{- with .Params.problem }}
<aside class="title-block problem-to-solution" aria-label="{{ i18n "Problem to solution" }}">
    <dl>
        <div class="title-block-row"><dt>{{ i18n "Problem" }}</dt><dd>{{ . }}</dd></div>
        {{- with $.Params.analysis }}
        <div class="title-block-row"><dt>{{ i18n "Analysis" }}</dt><dd>{{ . }}</dd></div>
        {{- end }}
        {{- with $.Params.solution }}
        <div class="title-block-row"><dt>{{ i18n "Solution" }}</dt><dd>{{ . }}</dd></div>
        {{- end }}
    </dl>
</aside>
{{- end }}
