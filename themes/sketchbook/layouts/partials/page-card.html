<article class="card">
    {{- with .Params.type }}
    <p class="card-kind">{{ . }}</p>
    {{- end }}
    <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{- with .Params.organization }}
    <p class="card-org">{{ . }}</p>
    {{- end }}
    <p class="card-summary">{{ .Description }}</p>
    {{- with .Params.domains }}
    <ul class="tag-list">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>
    {{- end }}
</article>
