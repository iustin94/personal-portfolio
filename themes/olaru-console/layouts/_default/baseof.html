<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    {{- partial "seo-head.html" . }}
    <link rel="stylesheet" href="{{ "hugo-theme-console/css/terminal-0.7.4.min.css" | absURL }}">
    <link rel="stylesheet" href="{{ "hugo-theme-console/css/animate-4.1.1.min.css" | absURL }}">
    <link rel="stylesheet" href="{{ "hugo-theme-console/css/console.css" | absURL }}">

    {{- partial "favicon.html" . -}}

    <link rel='stylesheet' href='{{ "css/hero.css" | absURL }}' />
    <link rel='stylesheet' href='{{ "css/tree.css" | absURL }}' />
    <link rel='stylesheet' href='{{ "css/custom-theme.css" | absURL }}' />
    <link rel='stylesheet' href='{{ "css/cookieconsent.css" | absURL }}' />
    <link rel="stylesheet" href="{{ "css/vendor/fontawesome.min.css" | absURL }}" />
    <link rel="stylesheet" href="{{ "css/vendor/brands.min.css" | absURL }}" />
    {{- partial "theme-toggle-script.html" . }}
</head>
<body class="terminal">
    <div class="container">

        {{ partial "header.html" . }}

        <div class="container {{ .Site.Params.animateStyle }}" style="margin-top: 2rem;">
            {{ block "main" . }}
            {{ end }}
            {{ partial "footer.html" . }}
        </div>
    </div>
    {{- partial "analytics.html" . -}}
  </body>
</html>
