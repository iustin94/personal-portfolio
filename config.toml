baseURL = "https://olaru.dk"
languageCode = "en-us"
title = "iustinian-olaru"
theme = "sketchbook"
publishDir = "docs"
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[mediaTypes."text/vnd.mermaid"]
  suffixes = ["mmd"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    anchorLineNos      = false
    codeFences         = true
    guessSyntax        = false
    hl_Lines           = ''
    hl_inline          = false
    lineAnchors        = ''
    lineNoStart        = 1
    lineNos            = false
    lineNumbersInTable = true
    noClasses          = true
    noHl               = false
    style              = 'rrt'
    tabWidth           = 4

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  # Google Analytics
  googleAnalyticsID = "G-J4LP1PW7S5"  # Replace with your actual GA4 ID

  # hugo-theme-console specific parameters
  # Cutting off the page title to two chars for mobile (e.g., Personal Profile -> Pe)
  titleCutting = true

  # Set the animation style -- https://animate.style/
  # To disable animations, remove/comment the animateStyle parameter
  animateStyle = "animated zoomIn fast"

  # OpenGraph and Twitter Cards
  description = "Business analyst and software architect. From business problem to running software, mostly in C#/.NET. Based in Denmark."
  title = "Iustinian Olaru"
  locale = "en_US"

  [params.person]
    region = "Fyn"
    country = "DK"

  [params.og]
    image = "/images/og.png"

  [params.Social]
    twitter = "iustinian_olaru"
    linkedin = "iustinian-olaru-b73a87387"
