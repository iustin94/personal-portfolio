<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Share image for olaru.dk</title>
    <style>
        @font-face {
            font-family: "Work Sans";
            font-weight: 400;
            src: url("../themes/sketchbook/static/sketchbook/fonts/work-sans-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "Work Sans";
            font-weight: 600;
            src: url("../themes/sketchbook/static/sketchbook/fonts/work-sans-latin-600-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "Caveat";
            font-weight: 700;
            src: url("../themes/sketchbook/static/sketchbook/fonts/caveat-latin-700-normal.woff2") format("woff2");
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 96px;
            box-sizing: border-box;
            font-family: "Work Sans", sans-serif;
            color: #e8f0fb;
            background-color: #12304f;
            background-image:
                linear-gradient(rgba(173, 205, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(173, 205, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .name {
            margin: 0 0 20px;
            font-size: 92px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        .role {
            align-self: flex-start;
            margin: 0 0 36px;
            padding: 4px 14px;
            font-size: 44px;
            font-weight: 600;
            background: rgba(255, 214, 92, 0.32);
        }

        .pitch {
            max-width: 900px;
            margin: 0 0 40px;
            font-size: 34px;
            line-height: 1.35;
            color: #b4c6de;
        }

        .address {
            margin: 0;
            font-family: "Caveat", cursive;
            font-size: 46px;
            color: #ff9b8a;
        }
    </style>
</head>
<body>
    <p class="name">Iustinian Olaru</p>
    <p class="role">Business Analyst &amp; Software Architect</p>
    <p class="pitch">From business problem to running software, with one person accountable for both.</p>
    <p class="address">olaru.dk</p>
</body>
</html>
